<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぐつぐつ、調合中。</title>
<style>
  :root {
    --bg-deep: #0d0715;
    --bg-mid: #170c26;
    --purple: #7c3aed;
    --purple-light: #a78bfa;
    --purple-glow: rgba(124, 58, 237, 0.35);
    --text: #ede9fe;
    --text-dim: #b7a9d9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    overflow-x: hidden;
    position: relative;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 40% 85%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 60% 45%, rgba(255,255,255,0.3), transparent);
    background-repeat: no-repeat;
  }

  main {
    position: relative;
    max-width: 560px;
    width: 100%;
    text-align: center;
    padding-block: 24px;
  }

  .cauldron-wrap {
    position: relative;
    width: min(70vw, 260px);
    margin: 0 auto 8px;
    filter: drop-shadow(0 0 24px var(--purple-glow));
  }

  svg { width: 100%; height: auto; display: block; overflow: visible; }

  .bubble {
    transform-origin: center;
    animation: rise 3.2s ease-in infinite;
  }
  .bubble.b1 { animation-delay: 0s; }
  .bubble.b2 { animation-delay: 1s; }
  .bubble.b3 { animation-delay: 2s; }
  .bubble.b4 { animation-delay: 0.6s; }
  .bubble.b5 { animation-delay: 1.7s; }

  @keyframes rise {
    0%   { transform: translateY(0) scale(0.7); opacity: 0; }
    15%  { opacity: 1; }
    80%  { opacity: 0.8; }
    100% { transform: translateY(-26px) scale(1.15); opacity: 0; }
  }

  .steam {
    animation: sway 3s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes sway {
    0%, 100% { transform: translateX(0) scaleY(1); }
    50%      { transform: translateX(3px) scaleY(1.03); }
  }

  .brew {
    animation: simmer 2.4s ease-in-out infinite;
    transform-origin: center bottom;
  }
  @keyframes simmer {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1.5px); }
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 12px 0 4px;
    color: var(--text);
  }

  .dots {
    display: inline-block;
    color: var(--purple-light);
  }

  p.sub {
    color: var(--text-dim);
    font-size: clamp(0.9rem, 3vw, 1rem);
    line-height: 1.8;
    margin: 12px auto 0;
    max-width: 40ch;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    padding: 8px 18px;
    border: 1px solid rgba(167, 139, 250, 0.35);
    border-radius: 999px;
    background: rgba(124, 58, 237, 0.08);
    color: var(--purple-light);
    font-size: 0.8rem;
    letter-spacing: 0.06em;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--purple-light);
    box-shadow: 0 0 8px var(--purple-light);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50%      { opacity: 1; transform: scale(1.15); }
  }

  footer {
    margin-top: 40px;
    font-size: 0.75rem;
    color: rgba(183, 169, 217, 0.5);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <main>
    <div class="cauldron-wrap">
      <svg viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <!-- steam -->
        <path class="steam" d="M100 95 C 90 82, 108 70, 100 58 C 92 46, 108 36, 102 26" />
        <circle class="bubble b1" cx="118" cy="20" r="9" />
        <circle class="bubble b2" cx="80" cy="55" r="7" />
        <circle class="bubble b3" cx="126" cy="70" r="8" />
        <circle class="bubble b4" cx="90" cy="35" r="3" stroke-width="6" />
        <circle class="bubble b5" cx="132" cy="45" r="3" stroke-width="6" />

        <!-- cauldron rim + brew -->
        <path class="brew" d="M35 100 C 55 112, 145 112, 165 100" />
        <path class="brew" d="M75 108 C 82 98, 94 98, 100 108" />
        <path class="brew" d="M112 108 C 118 100, 128 100, 132 106" />
        <path class="brew" d="M62 112 l 4 -5" />

        <!-- pot body -->
        <path d="M28 100
                 C 20 100, 18 112, 22 130
                 C 28 165, 55 195, 100 195
                 C 145 195, 172 165, 178 130
                 C 182 112, 180 100, 172 100
                 Z" />

        <!-- legs -->
        <path d="M55 195 L 48 213" />
        <path d="M100 195 L 100 215" />
        <path d="M145 195 L 152 213" />
      </svg>
    </div>

    <h1>ただいま、何かを調合中<span class="dots">…</span></h1>
    <p class="sub">大鍋の中でくつくつと、まだ言葉にならない何かが煮えています。<br>出来上がるまで、もう少しだけお待ちを。</p>

    <div class="badge"><span class="dot"></span>BREWING</div>

    <footer>yoku2</footer>
  </main>
</body>
</html>
