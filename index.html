<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yoku2 — よく、煮込む。</title>
<style>
  :root {
    --bg-deep: #0d0715;
    --bg-mid: #170c26;
    --purple: #7c3aed;
    --purple-light: #a78bfa;
    --purple-glow: rgba(124, 58, 237, 0.35);
    --text: #ede9fe;
    --text-dim: #b7a9d9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 15%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 40% 85%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 60% 45%, rgba(255,255,255,0.3), transparent);
    background-repeat: no-repeat;
  }

  header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px clamp(16px, 5vw, 48px);
    max-width: 1100px;
    margin: 0 auto;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    letter-spacing: 0.02em;
    font-size: 1.05rem;
  }

  .logo svg { width: 22px; height: 22px; }

  nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.85rem;
    margin-left: 24px;
  }
  nav a:hover { color: var(--text); }

  main {
    position: relative;
    max-width: 640px;
    width: 100%;
    text-align: center;
    margin: 0 auto;
    padding: clamp(16px, 6vw, 40px) 16px 64px;
  }

  .cauldron-wrap {
    position: relative;
    width: min(60vw, 240px);
    margin: 24px auto 8px;
    filter: drop-shadow(0 0 24px var(--purple-glow));
  }

  svg { width: 100%; height: auto; display: block; overflow: visible; }

  .bubble {
    transform-box: fill-box;
    transform-origin: center;
    animation: rise 3.2s ease-in infinite;
  }
  .bubble.b1 { animation-delay: 0s; }
  .bubble.b2 { animation-delay: 1s; }
  .bubble.b3 { animation-delay: 2s; }
  .bubble.b4 { animation-delay: 0.6s; }
  .bubble.b5 { animation-delay: 1.7s; }

  @keyframes rise {
    0%   { transform: translateY(0) scale(0.7); opacity: 0; }
    15%  { opacity: 1; }
    80%  { opacity: 0.8; }
    100% { transform: translateY(-22px) scale(1.15); opacity: 0; }
  }

  .steam {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: sway 3s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: translateX(0) scaleY(1); }
    50%      { transform: translateX(3px) scaleY(1.03); }
  }

  .brew {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: simmer 2.4s ease-in-out infinite;
  }
  @keyframes simmer {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1.5px); }
  }

  h1 {
    font-size: clamp(1.7rem, 5.5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 8px 0 4px;
    color: var(--text);
  }

  h1 .accent { color: var(--purple-light); }

  p.sub {
    color: var(--text-dim);
    font-size: clamp(0.9rem, 3vw, 1.05rem);
    line-height: 1.9;
    margin: 16px auto 0;
    max-width: 42ch;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 40px;
    text-align: left;
  }
  @media (max-width: 520px) {
    .cards { grid-template-columns: 1fr; }
  }

  .card {
    border: 1px solid rgba(167, 139, 250, 0.2);
    background: rgba(124, 58, 237, 0.06);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .card .k { color: var(--purple-light); font-size: 0.78rem; letter-spacing: 0.08em; }
  .card p { margin: 6px 0 0; font-size: 0.88rem; color: var(--text-dim); line-height: 1.6; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 32px;
    padding: 8px 18px;
    border: 1px solid rgba(167, 139, 250, 0.35);
    border-radius: 999px;
    background: rgba(124, 58, 237, 0.08);
    color: var(--purple-light);
    font-size: 0.8rem;
    letter-spacing: 0.06em;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--purple-light);
    box-shadow: 0 0 8px var(--purple-light);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50%      { opacity: 1; transform: scale(1.15); }
  }

  footer {
    text-align: center;
    padding: 24px 16px 40px;
    font-size: 0.75rem;
    color: rgba(183, 169, 217, 0.5);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="stars"></div>

  <header>
    <div class="logo">
      <svg viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#a78bfa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M28 100 C 20 100, 18 112, 22 130 C 28 165, 55 195, 100 195 C 145 195, 172 165, 178 130 C 182 112, 180 100, 172 100 Z" />
        <path d="M55 195 L 48 213" /><path d="M100 195 L 100 215" /><path d="M145 195 L 152 213" />
      </svg>
      yoku2
    </div>
    <nav>
      <a href="#about">about</a>
      <a href="#contact">contact</a>
    </nav>
  </header>

  <main>
    <div class="cauldron-wrap">
      <svg viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <!-- steam -->
        <path class="steam" d="M100 95 C 90 82, 108 70, 100 58 C 92 46, 108 36, 102 26" />
        <circle class="bubble b1" cx="118" cy="20" r="9" />
        <circle class="bubble b2" cx="80" cy="55" r="7" />
        <circle class="bubble b3" cx="126" cy="70" r="8" />
        <circle class="bubble b4" cx="90" cy="35" r="3" stroke-width="6" />
        <circle class="bubble b5" cx="132" cy="45" r="3" stroke-width="6" />

        <!-- cauldron rim + brew -->
        <path class="brew" d="M35 100 C 55 112, 145 112, 165 100" />
        <path class="brew" d="M75 108 C 82 98, 94 98, 100 108" />
        <path class="brew" d="M112 108 C 118 100, 128 100, 132 106" />
        <path class="brew" d="M62 112 l 4 -5" />

        <!-- pot body -->
        <path d="M28 100
                 C 20 100, 18 112, 22 130
                 C 28 165, 55 195, 100 195
                 C 145 195, 172 165, 178 130
                 C 182 112, 180 100, 172 100
                 Z" />

        <!-- legs -->
        <path d="M55 195 L 48 213" />
        <path d="M100 195 L 100 215" />
        <path d="M145 195 L 152 213" />
      </svg>
    </div>

    <h1>よく<span class="accent">、</span>煮込む。</h1>
    <p class="sub">急がず、じっくりと。大鍋の中で時間をかけて、味がしみ込んでいく。<br>yoku2 は、そんな時間のためのサイトです。</p>

    <div class="cards">
      <div class="card"><div class="k">じっくり</div><p>火を弱めて、ゆっくりと</p></div>
      <div class="card"><div class="k">コトコト</div><p>焦らず、かき混ぜながら</p></div>
      <div class="card"><div class="k">あたたかく</div><p>できあがるまで、そばで待つ</p></div>
    </div>

    <div class="badge"><span class="dot"></span>BREWING</div>
  </main>

  <footer id="contact">yoku2.com</footer>
</body>
</html>
