<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yoku2 — よく、煮込む。</title>
<style>
  :root {
    --bg-deep: #0d0715;
    --bg-mid: #170c26;
    --purple: #7c3aed;
    --purple-light: #a78bfa;
    --purple-glow: rgba(124, 58, 237, 0.35);
    --text: #ede9fe;
    --text-dim: #b7a9d9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 15%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 40% 85%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 60% 45%, rgba(255,255,255,0.3), transparent);
    background-repeat: no-repeat;
  }

  header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px clamp(16px, 5vw, 48px);
    max-width: 1100px;
    margin: 0 auto;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    letter-spacing: 0.02em;
    font-size: 1.05rem;
  }

  .logo img { width: 22px; height: 22px; display: block; }

  nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.85rem;
    margin-left: 24px;
  }
  nav a:hover { color: var(--text); }

  main {
    position: relative;
    max-width: 640px;
    width: 100%;
    text-align: center;
    margin: 0 auto;
    padding: clamp(16px, 6vw, 40px) 16px 64px;
  }

  .cauldron-wrap {
    position: relative;
    width: min(60vw, 240px);
    margin: 24px auto 8px;
    filter: drop-shadow(0 0 24px var(--purple-glow));
  }

  .cauldron-wrap img {
    width: 100%;
    height: auto;
    display: block;
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  h1 {
    font-size: clamp(1.7rem, 5.5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 8px 0 4px;
    color: var(--text);
  }

  h1 .accent { color: var(--purple-light); }

  p.sub {
    color: var(--text-dim);
    font-size: clamp(0.9rem, 3vw, 1.05rem);
    line-height: 1.9;
    margin: 16px auto 0;
    max-width: 42ch;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 40px;
    text-align: left;
  }
  @media (max-width: 520px) {
    .cards { grid-template-columns: 1fr; }
  }

  .card {
    border: 1px solid rgba(167, 139, 250, 0.2);
    background: rgba(124, 58, 237, 0.06);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .card .k { color: var(--purple-light); font-size: 0.78rem; letter-spacing: 0.08em; }
  .card p { margin: 6px 0 0; font-size: 0.88rem; color: var(--text-dim); line-height: 1.6; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 32px;
    padding: 8px 18px;
    border: 1px solid rgba(167, 139, 250, 0.35);
    border-radius: 999px;
    background: rgba(124, 58, 237, 0.08);
    color: var(--purple-light);
    font-size: 0.8rem;
    letter-spacing: 0.06em;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--purple-light);
    box-shadow: 0 0 8px var(--purple-light);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50%      { opacity: 1; transform: scale(1.15); }
  }

  footer {
    text-align: center;
    padding: 24px 16px 40px;
    font-size: 0.75rem;
    color: rgba(183, 169, 217, 0.5);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="stars"></div>

  <header>
    <div class="logo">
      <img src="assets/cauldron.svg" alt="" width="22" height="22">
      yoku2
    </div>
    <nav>
      <a href="#about">about</a>
      <a href="#contact">contact</a>
    </nav>
  </header>

  <main>
    <div class="cauldron-wrap">
      <img src="assets/cauldron.svg" alt="よく煮込む大鍋" width="1254" height="1254">
    </div>

    <h1>よく<span class="accent">、</span>煮込む。</h1>
    <p class="sub">急がず、じっくりと。大鍋の中で時間をかけて、味がしみ込んでいく。<br>yoku2 は、そんな時間のためのサイトです。</p>

    <div class="cards">
      <div class="card"><div class="k">じっくり</div><p>火を弱めて、ゆっくりと</p></div>
      <div class="card"><div class="k">コトコト</div><p>焦らず、かき混ぜながら</p></div>
      <div class="card"><div class="k">あたたかく</div><p>できあがるまで、そばで待つ</p></div>
    </div>

    <div class="badge"><span class="dot"></span>BREWING</div>
  </main>

  <footer id="contact">yoku2.com</footer>
</body>
</html>
